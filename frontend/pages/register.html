<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — WeatherSphere</title>
  <meta name="description" content="Register your free WeatherSphere account to synchronize favorite cities and manage your weather lookup history.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌦️</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-brand" aria-label="WeatherSphere Home">
        <span class="brand-icon">🌦️</span>
        <span class="brand-text">Weather<span>Sphere</span></span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="../index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="forecast.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Forecast</a></li>
          <li><a href="cities.html" class="nav-link"><i class="fa-solid fa-city"></i> Cities</a></li>
          <li><a href="favorites.html" class="nav-link"><i class="fa-solid fa-star"></i> Favorites</a></li>
          <li><a href="history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> History</a></li>
          <li><a href="about.html" class="nav-link"><i class="fa-solid fa-circle-info"></i> About</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="btn-icon-toggle theme-toggle-btn" aria-label="Toggle Theme">
          <i class="fa-solid fa-sun"></i>
        </button>

        <button class="hamburger-btn" aria-label="Toggle navigation menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Form Card -->
  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-card fade-in">
        <div class="auth-header">
          <span class="brand-icon" style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem;">🌦️</span>
          <h1>Create Account</h1>
          <p>Join WeatherSphere to save favorite locations and customize settings.</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <div class="form-input-wrap">
              <i class="fa-regular fa-user form-input-icon"></i>
              <input type="text" id="reg-name" name="name" class="form-input" placeholder="Alex Morgan" required autocomplete="name" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <div class="form-input-wrap">
              <i class="fa-regular fa-envelope form-input-icon"></i>
              <input type="email" id="reg-email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="form-input-wrap">
              <i class="fa-solid fa-lock form-input-icon"></i>
              <input type="password" id="reg-password" name="password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="form-input-wrap">
              <i class="fa-solid fa-shield-halved form-input-icon"></i>
              <input type="password" id="reg-confirm-password" name="confirmPassword" class="form-input" placeholder="Re-type your password" minlength="6" required autocomplete="new-password" />
            </div>
          </div>

          <button type="submit" class="btn-submit-auth">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>&copy; 2026 WeatherSphere. All rights reserved.</span>
        <span>Secure bcrypt Hashing & JWT Validation</span>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { authManager } from '../js/auth.js';
    authManager.setupRegisterForm('register-form');
  </script>
</body>
</html>
